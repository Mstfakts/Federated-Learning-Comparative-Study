client: 5

round: 10

training:
  batch_size: 64
  learning_rate: 0.01

data:
  dataset_path: "train_imputed_lowvarianceremoved225.csv"
  smote: false
  rus: false
  scale: false
  encode: true
  pca: 0
  kbest: true
  batch_size: 64

aggregation:
  method: FedF1

server:
  address: "127.0.0.1:8080"

model:
  objective: "binary:logistic"
  learning_rate: 0.1
  max_depth: 3
  tree_method: "hist"
  eval_metric: 'logloss'
  n_estimators: 200
  scale_pos_weight: 5
  use_label_encoder: False
