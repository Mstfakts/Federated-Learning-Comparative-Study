client: 5

round: 10

training:
  batch_size: 64
  learning_rate: 0.01

data:
  dataset_path: "hmeq_imputed_scaled_encoded.csv"
  smote: false
  rus: false
  scale: false
  encode: false
  pca: 0
  kbest: false
  batch_size: 64

aggregation:
  method: FedAvg

server:
  address: "127.0.0.1:8080"

model:
  class_weight: balanced
  criterion: 'gini'
  n_estimators: 200
  max_depth: 20
  min_samples_split: 5
  min_samples_leaf: 1
  max_features: 'sqrt'
  bootstrap: true
