client: 5

round: 10

training:
  batch_size: 64
  learning_rate: 0.01

data:
  dataset_path: "hmeq_imputed_scaled_encoded.csv"
  smote: false
  rus: false
  scale: false
  encode: false
  pca: 0
  kbest: false
  batch_size: 64

aggregation:
  method: FedAvg

